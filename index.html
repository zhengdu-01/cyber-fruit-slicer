<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛博朋克切水果</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div class="ui-overlay">
            <div class="score-display">
                <span class="score-label">分数</span>
                <span class="score-value" id="score">0</span>
            </div>
            <div class="lives-display">
                <span class="lives-label">生命</span>
                <span class="lives-value" id="lives">3</span>
            </div>
            <div class="combo-display" id="combo"></div>
        </div>
        
        <div class="menu-screen" id="startMenu">
            <div class="menu-content">
                <h1 class="game-title">CYBER FRUIT</h1>
                <p class="game-subtitle">SLICER 2077</p>
                <button class="start-btn" id="startBtn">开始游戏</button>
                <p class="instruction">滑动切割水果 | 避开掉落</p>
            </div>
        </div>
        
        <div class="menu-screen" id="gameOverMenu">
            <div class="menu-content">
                <h1 class="game-over-title">GAME OVER</h1>
                <p class="final-score">最终得分: <span id="finalScore">0</span></p>
                <button class="start-btn" id="restartBtn">再来一局</button>
            </div>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
